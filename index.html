<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kick Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Kick Tracker</h1>

    <p id="auth" class="muted"></p>

    <button id="kick" type="button">Kick!</button>
    <p id="today" class="muted"></p>
    <p><button id="undo" type="button" class="link">Undo last kick</button></p>

    <section>
      <h2>Log a past kick</h2>
      <form id="past" class="row">
        <input id="pastTime" type="datetime-local" required>
        <input id="pastCount" type="number" min="1" max="100" value="1" aria-label="Number of kicks">
        <button type="submit">Add</button>
      </form>
    </section>

    <section>
      <h2>When does the baby kick most?</h2>
      <p class="muted">Kicks by hour of day, all days combined.</p>
      <svg id="hourChart" viewBox="0 0 480 220" role="img" aria-label="Kicks by hour of day"></svg>
    </section>

    <section>
      <h2>Kicks per day</h2>
      <svg id="dayChart" viewBox="0 0 480 220" role="img" aria-label="Kicks per day"></svg>
    </section>

    <section>
      <h2>Recent kicks</h2>
      <ul id="recent"></ul>
    </section>

    <section class="row">
      <button id="export" type="button" class="link">Export JSON</button>
      <label class="link">Import JSON<input id="import" type="file" accept="application/json" hidden></label>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
