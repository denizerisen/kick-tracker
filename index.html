<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf4ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kicks">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title data-i18n="Kick Tracker">Kick Tracker</title>
  <script>
    try { const t = localStorage.getItem("kicktracker.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme" class="theme-toggle" type="button" aria-label="Toggle light and dark theme" data-i18n-aria-label="Toggle light and dark theme">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
  </button>
  <button id="lang" class="theme-toggle lang-toggle" type="button"></button>
  <main>
    <header class="g-head">
      <h1 data-i18n="Kick Tracker">Kick Tracker</h1>
      <p class="subtitle" data-i18n="Every little movement, remembered.">Every little movement, remembered.</p>
      <div id="auth" class="muted"></div>
    </header>

    <div class="hero g-hero">
      <button id="kick" type="button" aria-label="Log a kick" data-i18n-aria-label="Log a kick"><span data-i18n="Kick!">Kick!</span></button>
      <p id="today"></p>
      <button id="undo" type="button" class="link" data-i18n="Undo last kick">Undo last kick</button>
    </div>

    <section class="card g-past">
      <h2 data-i18n="Log a past kick">Log a past kick</h2>
      <form id="past" class="row">
        <input id="pastDate" type="date" required aria-label="Date" data-i18n-aria-label="Date">
        <input id="pastTime" type="time" required aria-label="Time" data-i18n-aria-label="Time">
        <input id="pastCount" type="number" min="1" max="100" value="1" aria-label="Number of kicks" data-i18n-aria-label="Number of kicks">
        <button type="submit" data-i18n="Add">Add</button>
      </form>
    </section>

    <section class="card g-hour">
      <h2 data-i18n="When does the baby kick most?">When does the baby kick most?</h2>
      <p id="peak" class="peak" data-i18n="Kicks by hour of day, all days combined.">Kicks by hour of day, all days combined.</p>
      <svg id="hourChart" viewBox="0 0 480 220" role="img" aria-label="Kicks by hour of day" data-i18n-aria-label="Kicks by hour of day"></svg>
    </section>

    <section class="card g-day">
      <h2 data-i18n="Kicks per day">Kicks per day</h2>
      <p class="muted" data-i18n="The last 14 days.">The last 14 days.</p>
      <svg id="dayChart" viewBox="0 0 480 220" role="img" aria-label="Kicks per day" data-i18n-aria-label="Kicks per day"></svg>
    </section>

    <section class="card g-recent">
      <h2 data-i18n="Recent kicks">Recent kicks</h2>
      <ul id="recent"></ul>
    </section>

    <footer class="row g-foot">
      <button id="export" type="button" class="link" data-i18n="Export JSON">Export JSON</button>
      <label class="link"><span data-i18n="Import JSON">Import JSON</span><input id="import" type="file" accept="application/json" hidden></label>
    </footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
