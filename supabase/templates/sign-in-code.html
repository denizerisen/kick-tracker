<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light only" />
    <title>Kick Tracker sign-in code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #fbf4ee">
    <!-- Shown in the inbox preview, and where iOS looks for a code to offer above the keyboard. -->
    <div style="display: none; max-height: 0; overflow: hidden">Your Kick Tracker code is {{ .Token }}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #fbf4ee">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 480px; background-color: #ffffff; border: 1px solid #e9dcd6; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #4a3b40"
          >
            <tr>
              <td style="padding: 24px 28px; background-color: #f4a6b0; border-radius: 15px 15px 0 0; color: #2b2226; font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size: 26px; font-weight: 700">
                Kick Tracker
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 28px 8px; font-size: 17px; line-height: 1.5; font-weight: 700; color: #2b2226">
                Your sign-in code
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 16px 28px">
                <div
                  style="display: inline-block; padding: 14px 24px; background-color: #fbf4ee; border: 1px solid #e9dcd6; border-radius: 12px; font-size: 40px; font-weight: 700; letter-spacing: 10px; color: #c9647a; font-family: 'SF Mono', Menlo, Consolas, monospace"
                >
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 28px 28px; font-size: 15px; line-height: 1.5; color: #8f7f84">
                Type this code in Kick Tracker to sign in. It works for a short time. If you didn't ask for it, you can ignore
                this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
